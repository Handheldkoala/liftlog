<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#f2f2f7">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('ll-theme') || 'auto'; } catch (e) {}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
<title>Lift Log</title>
</head>
<body>
<main id="view"></main>
<div id="restbar" class="hide"></div>
<nav id="tabs">
  <button data-a="tab" data-tab="train"><span data-ic="barbell"></span>Train</button>
  <button data-a="tab" data-tab="history"><span data-ic="clock"></span>History</button>
  <button data-a="tab" data-tab="progress"><span data-ic="chart"></span>Progress</button>
  <button data-a="tab" data-tab="library"><span data-ic="list"></span>Library</button>
  <button data-a="tab" data-tab="body"><span data-ic="scale"></span>Body</button>
</nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="vid-in" accept="video/*" hidden>
<input type="file" id="import-in" accept="application/json,.json" hidden>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
